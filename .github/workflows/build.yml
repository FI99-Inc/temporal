# Build and test Temporal Engine on Linux, then package the Windows installer
# and raw executable once those checks pass (commands as documented in README.md).
name: Build

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

# Read-only: the workflow never writes to the repository.
permissions:
  contents: read

# One run per ref. A newer pull request push cancels the older run; branch
# pushes and manual runs are allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # rust-toolchain.toml pins 1.98.0 with clippy and rustfmt. Install it
      # before rust-cache, which keys on the active rustc.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      # The frontend build runs before Rust because the custom-protocol build
      # embeds dist/ into the binary.
      - name: Frontend tests
        run: npm test

      - name: Frontend type check and build
        run: npm run build

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-features --locked

  windows:
    name: Windows installer
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # Tauri's beforeBuildCommand runs `npm run build`; tauri.conf.json selects
      # the per-user NSIS installer.
      - name: Build NSIS installer
        env:
          CI: true
        run: npx tauri build --bundles nsis --ci

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: temporal-engine-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload raw executable
        uses: actions/upload-artifact@v4
        with:
          name: temporal-engine-windows-exe
          path: target/release/temporal-app.exe
          if-no-files-found: error
          retention-days: 30
