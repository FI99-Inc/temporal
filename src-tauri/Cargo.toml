[package]
name = "temporal-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "temporal-app"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-notification", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-autostart", "dep:ureq"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
dev-tools = []

[dependencies]
temporal-core = { path = "../crates/temporal-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.26.0", features = ["v4", "v5"] }
rrule = "=0.14.0"
tauri = { version = "=2.11.5", optional = true, features = ["tray-icon"] }
tauri-plugin-dialog = { version = "=2.7.3", optional = true }
tauri-plugin-notification = { version = "=2.4.0", optional = true }
tauri-plugin-single-instance = { version = "=2.4.5", optional = true }
tauri-plugin-autostart = { version = "=2.5.1", optional = true }
ureq = { version = "=3.4.2", optional = true }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[build-dependencies]
tauri-build = { version = "=2.6.3", optional = true, features = [] }

[[bin]]
name = "temporal-app"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "scenario-preview"
path = "src/bin/scenario-preview.rs"
required-features = ["dev-tools"]

[lints]
workspace = true
